[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clv-harness"
version = "0.0.1"
description = "Measurement infrastructure for closing-line value against an independent pre-event benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
]

[project.scripts]
clv = "clv.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "raw-recorder",
]

[tool.uv.workspace]
members = ["tools/raw_recorder"]

[tool.uv.sources]
raw-recorder = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/clv"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/raw_recorder/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
