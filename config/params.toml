# Harness parameters, created in V0 from DESIGN.md §10 and authoritative from now on.
#
# One table per §10 key: `value`, `status` (fixed | provisional) and `revised_by`
# (the §10 "Set or revised by" cell, verbatim). Some keys carry extra fields
# that §10 states in prose (for example a polling window); they are named here.
# Durations whose §10 default is written in hours or minutes are stored in seconds.
#
# Rules (§10):
# - No threshold exists outside this file. A value the code needs that is not
#   here is added to DESIGN.md §10 first, then here.
# - Fixed values change only by a design change. Provisional values change by a
#   dated decision record in docs/decisions/, then here.
# - A change that alters a metric's meaning creates a new close_def, resolver
#   or run version; it never edits a reported result.
#
# tests/test_params.py checks every key against the §10 table, and the R0
# values against tools/raw_recorder/config.toml.

