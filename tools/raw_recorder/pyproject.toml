[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raw-recorder"
version = "0.1.0"
description = "R0 raw evidence recorder for the CLV harness (DESIGN.md §13 R0, §7.1 archive format)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "cryptography>=43",
]

[project.scripts]
raw-recorder = "raw_recorder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raw_recorder"]
