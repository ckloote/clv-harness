# systemd drop-in for raw-recorder.service (raw-recorder-pi.service as installed) on the A1 host:
# the Gate A1 run (docs/decisions/2026-10-17-a1-gate-plan.md; deploy/pi-host.md section 10).
#
# The recorder runs config.gate.toml, which is config.toml with the fault harness on and the stream
# through the relay. The drop-in also pulls in raw-recorder-relay.service, which the unit is
# already ordered after. Everything else (the clock wait, the SSD, restarts) stays the unit's.
#
# Install for the run (as root), then restart between dense windows:
#   install -D -m 644 deploy/raw-recorder-gate.conf /etc/systemd/system/raw-recorder.service.d/gate.conf
#   cp deploy/raw-recorder-relay.service /etc/systemd/system/
#   systemctl daemon-reload && systemctl restart raw-recorder.service
# Remove it afterwards, which restores Production:
#   rm /etc/systemd/system/raw-recorder.service.d/gate.conf
#   systemctl daemon-reload && systemctl restart raw-recorder.service && systemctl stop raw-recorder-relay.service

[Unit]
Wants=raw-recorder-relay.service

[Service]
ExecStart=
ExecStart=/home/recorder/clv-harness/.venv/bin/raw-recorder --config /home/recorder/clv-harness/tools/raw_recorder/config.gate.toml run
